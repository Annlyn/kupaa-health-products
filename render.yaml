# One-click API deploy on Render. This hosts the part GitHub Pages cannot run:
# Express, Prisma, the database, and your payment/shipping secrets.
#
# On Render: New > Blueprint > pick this repository.
#
# BEFORE DEPLOYING, change one line in server/prisma/schema.prisma:
#     datasource db { provider = "postgresql" }   // was "sqlite"
# Prisma needs the provider as a literal, so it cannot be set from an env var.
# SQLite also would not survive a redeploy on Render's ephemeral disk.
services:
  - type: web
    name: kupaa-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Your GitHub Pages URL, e.g. https://yourname.github.io
      # Comma-separate to allow more than one origin.
      - key: CLIENT_URL
        sync: false

      # This service's own public URL, e.g. https://kupaa-api.onrender.com
      - key: SERVER_URL
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: kupaa-db
          property: connectionString

      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # Leave blank: `npm run seed` generates one and prints it once in the log.
      - key: ADMIN_PASSWORD
        sync: false

      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: SHIPROCKET_WEBHOOK_TOKEN
        sync: false

databases:
  - name: kupaa-db
    plan: free
