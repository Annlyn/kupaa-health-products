# One-click API deploy on Render. This hosts the part GitHub Pages cannot run:
# Express, Prisma, the database, and your payment/shipping secrets.
#
# On Render: New > Blueprint > pick this repository.
#
# The Prisma provider no longer needs editing by hand — scripts/set-db-provider.js
# reads DATABASE_URL during the build and sets it to postgresql there, sqlite
# locally, so the same commit runs in both places.
services:
  - type: web
    name: kupaa-api
    runtime: node
    # `starter`, not `free`, because of the disk below: Render does not offer
    # persistent disks on free instances, and free instances also spin down.
    plan: starter
    rootDir: server
    buildCommand: npm install && node scripts/set-db-provider.js && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /api/health

    # Product images are written to the filesystem (src/middleware/upload.js).
    # Without a disk they live on the container's ephemeral storage and every
    # deploy silently deletes the whole catalogue's imagery.
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production

      # Must sit on the mounted disk above, not the default ./uploads.
      - key: UPLOAD_DIR
        value: /var/data/uploads

      # Your GitHub Pages URL, e.g. https://annlyn.github.io
      # Comma-separate to allow more than one origin.
      - key: CLIENT_URL
        sync: false

      # This service's own public URL, e.g. https://kupaa-api.onrender.com
      - key: SERVER_URL
        sync: false

      # Render's free Postgres is DELETED 30 days after creation. To use a
      # provider without that limit (Neon and Supabase both have free tiers),
      # delete the `databases:` block at the bottom of this file and replace
      # this entry with `sync: false`, then paste their connection string into
      # the Render dashboard. No code changes either way.
      - key: DATABASE_URL
        fromDatabase:
          name: kupaa-db
          property: connectionString

      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # Only used when seeding a fresh database from scratch. Importing an
      # existing one with `npm run db:migrate-to` brings your admin across
      # instead, password included.
      - key: ADMIN_PASSWORD
        sync: false

      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      - key: AMAZON_LWA_CLIENT_ID
        sync: false
      - key: AMAZON_LWA_CLIENT_SECRET
        sync: false
      - key: AMAZON_LWA_REFRESH_TOKEN
        sync: false
      - key: AMAZON_SHIP_FROM_PINCODE
        sync: false
      - key: SHIPPING_WEBHOOK_TOKEN
        sync: false

      - key: LOGIN_OTP_ENABLED
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_OWNER_NUMBER
        sync: false
      - key: WHATSAPP_TEMPLATE_NEW_ORDER
        sync: false
      - key: WHATSAPP_TEMPLATE_PAYMENT_RECEIVED
        sync: false
      - key: WHATSAPP_TEMPLATE_INVOICE
        sync: false

databases:
  - name: kupaa-db
    plan: free
