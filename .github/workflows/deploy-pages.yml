# Builds the storefront and publishes it to GitHub Pages.
#
# Pages serves static files only — it cannot run the API, the database or hold
# your payment keys. Host the server elsewhere (Render, Railway, Fly.io, a VPS)
# and point this build at it with the API_URL repository variable.
#
# One-time setup, under the repository Settings:
#   Pages → Source: GitHub Actions
#   Secrets and variables → Actions → Variables → New repository variable
#        Name:  API_URL
#        Value: https://your-api-host.example.com
name: Deploy storefront to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail early if the API URL is missing
        if: vars.API_URL == ''
        run: |
          echo "::error::Repository variable API_URL is not set."
          echo "The storefront needs an API to talk to. Deploy the server first, then add"
          echo "API_URL under Settings > Secrets and variables > Actions > Variables."
          exit 1

      - name: Build storefront
        env:
          # Project sites are served from /<repo>/, so the bundle needs that base.
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.API_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
