name: Deploy Client to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report build mode
        # Pages is never same-origin with the API. With VITE_API_URL set the
        # build talks to that server; without it the demo snapshot stands in,
        # and if demo/ has been deleted too there is nothing to fall back on.
        run: |
          if [ -n "${{ vars.VITE_API_URL }}" ]; then
            echo "::notice::Building against ${{ vars.VITE_API_URL }}"
          elif [ -f demo/adapter.js ]; then
            echo "::notice::VITE_API_URL is not set - building in demo mode from demo/data.json"
          else
            echo "::warning::VITE_API_URL is not set and demo/ is gone - the site will have no data. Set the variable under Settings > Secrets and variables > Actions > Variables."
          fi

      - name: Build client
        # Vite inlines env at build time, so these must be set here rather than
        # configured on the deployed site afterwards.
        run: npm run build -w client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_DEMO: ${{ vars.VITE_API_URL == '' }}
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./client/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
